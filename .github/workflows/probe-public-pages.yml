name: Probe public archive pages

# Temporary release investigation. Status and shape only; article bodies are never logged.
on:
  workflow_dispatch:
  push:
    branches: [fix/older-posts]
    paths: [.github/workflows/probe-public-pages.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROBE_NAME: substack-reader-probe-37809333643
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Create isolated status-only probe
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/substack-probe"
          cat > "$RUNNER_TEMP/substack-probe/index.js" <<'JS'
          const targets = [
            ['sitemap', 'https://andrewhclu.substack.com/sitemap.xml'],
            ['archive', 'https://andrewhclu.substack.com/archive'],
            ['older-post', 'https://andrewhclu.substack.com/p/what-if-tsmc-to-spend-us100bn-in'],
          ];
          export default {
            async fetch(request) {
              if (new URL(request.url).pathname !== '/probe') return new Response('Not found', { status: 404 });
              const results = [];
              for (const [target, url] of targets) {
                try {
                  const response = await fetch(url, {
                    headers: { 'User-Agent': 'SubstackReaderForEvenHub/0.1.1', Accept: target === 'sitemap' ? 'application/xml' : 'text/html' },
                    redirect: 'manual', signal: AbortSignal.timeout(10000),
                  });
                  const body = await response.text();
                  results.push({ target, status: response.status, type: response.headers.get('content-type'),
                    bytes: new TextEncoder().encode(body).length, preloads: body.includes('window._preloads'),
                    postUrls: target === 'sitemap' ? (body.match(/<loc>https:\/\/andrewhclu\.substack\.com\/p\//g) || []).length : undefined });
                } catch { results.push({ target, status: 'network-error' }); }
              }
              return Response.json(results, { headers: { 'Cache-Control': 'no-store' } });
            },
          };
          JS
          printf '{"name":"%s","main":"index.js","compatibility_date":"2026-10-01","workers_dev":true,"observability":{"enabled":false}}\n' "$PROBE_NAME" > "$RUNNER_TEMP/substack-probe/wrangler.json"
          pnpm exec wrangler deploy --config "$RUNNER_TEMP/substack-probe/wrangler.json"
      - name: Read status-only results
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const url = `https://${process.env.PROBE_NAME}.chihin-lau-work.workers.dev/probe`;
          let response;
          for (let attempt = 0; attempt < 12; attempt++) {
            response = await fetch(url, { signal: AbortSignal.timeout(45000) });
            if (response.ok) break;
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!response.ok) throw new Error(`Probe HTTP ${response.status}`);
          const result = await response.json();
          console.log(JSON.stringify(result, null, 2));
          console.log(`::notice title=Public-page probe::${JSON.stringify(result)}`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Status-only Cloudflare public-page probe:\n\n\u0060\u0060\u0060json\n${JSON.stringify(result, null, 2)}\n\u0060\u0060\u0060\n`);
          JS
      - name: Remove this run's isolated probe Worker
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const { CLOUDFLARE_ACCOUNT_ID: account, CLOUDFLARE_API_TOKEN: token, PROBE_NAME: name } = process.env;
          if (name !== 'substack-reader-probe-37809333643') throw new Error('Unexpected cleanup target');
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}`, {
            method: 'DELETE', headers: { Authorization: `Bearer ${token}` },
          });
          if (!response.ok) throw new Error(`Probe cleanup HTTP ${response.status}`);
          console.log('::notice title=Probe cleanup::Removed isolated diagnostic Worker');
          JS

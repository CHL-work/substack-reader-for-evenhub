name: Probe older public archive pages

# Temporary release investigation. Fixed targets; only status and header counts leave the probe.
on:
  workflow_dispatch:
  push:
    branches: [fix/older-posts]
    paths: [.github/workflows/probe-public-pages.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROBE_NAME: substack-reader-probe-older-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Create isolated status-only probe
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/substack-probe"
          cat > "$RUNNER_TEMP/substack-probe/index.js" <<'JS'
          // These are sitemap post offsets 4, 5 and 20, checked with the honest UA on 2026-10-08.
          const targets = [
            ['sitemap', 'https://andrewhclu.substack.com/sitemap.xml'],
            ['offset-4', 'https://andrewhclu.substack.com/p/understanding-the-balance-film-industry-be1'],
            ['offset-5', 'https://andrewhclu.substack.com/p/micron-turning-from-margin-to-capacity'],
            ['offset-20', 'https://andrewhclu.substack.com/p/3-reasons-might-turn-nvidia-into'],
          ];
          let result;
          async function probe(env) {
            const results = [];
            for (const [target, url] of targets) {
              try {
                const response = await fetch(url, {
                  headers: { 'User-Agent': env.READER_USER_AGENT, Accept: target === 'sitemap' ? 'application/xml' : 'text/html' },
                  redirect: 'manual', signal: AbortSignal.timeout(10000),
                });
                const servedBy = (response.headers.get('x-served-by') || '').split(',').map(value => value.trim()).filter(Boolean);
                results.push({ target, status: response.status, contentType: response.headers.get('content-type'),
                  servedByCount: servedBy.length, servedBySubstackCount: servedBy.filter(value => /substack/i.test(value)).length });
                // Do not read, retain or log XML/article bodies.
                await response.body?.cancel();
              } catch { results.push({ target, status: 'network-error', contentType: null, servedByCount: 0, servedBySubstackCount: 0 }); }
            }
            return results;
          }
          export default {
            async fetch(request, env) {
              const path = new URL(request.url).pathname;
              if (path === '/ready') return new Response('ready', { headers: { 'Cache-Control': 'no-store' } });
              if (path !== '/probe') return new Response('Not found', { status: 404 });
              // Repeated reads in the same isolate reuse the four-request result, with no KV or persistent data.
              result ??= probe(env);
              return Response.json(await result, { headers: { 'Cache-Control': 'no-store' } });
            },
          };
          JS
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          writeFileSync(`${process.env.RUNNER_TEMP}/substack-probe/wrangler.json`, JSON.stringify({
            name: process.env.PROBE_NAME, main: 'index.js', compatibility_date: '2026-10-01', workers_dev: true,
            observability: { enabled: false }, vars: { READER_USER_AGENT: `SubstackReaderForEvenHub/${version}` },
          }));
          JS
          pnpm exec wrangler deploy --config "$RUNNER_TEMP/substack-probe/wrangler.json"
      - name: Wait for deployment and read four status-only results
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const origin = `https://${process.env.PROBE_NAME}.chihin-lau-work.workers.dev`;
          let ready = false;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const response = await fetch(`${origin}/ready`, { redirect: 'manual', signal: AbortSignal.timeout(10000) });
              ready = response.ok && (await response.text()) === 'ready';
            } catch { /* DNS/TLS propagation can lag deployment. */ }
            if (ready) break;
            if (attempt < 11) await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!ready) throw new Error('Probe did not become ready after 12 deployment checks.');
          // Read /probe once only; readiness checks never cause upstream Substack requests.
          const response = await fetch(`${origin}/probe`, { redirect: 'manual', signal: AbortSignal.timeout(60000) });
          if (!response.ok) throw new Error(`Probe HTTP ${response.status}`);
          const result = await response.json();
          if (!Array.isArray(result) || result.length !== 4) throw new Error('Expected four status-only probe results.');
          console.log(JSON.stringify(result, null, 2));
          console.log(`::notice title=Older-page probe::${JSON.stringify(result)}`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Status-only Cloudflare older-page probe:\n\n\u0060\u0060\u0060json\n${JSON.stringify(result, null, 2)}\n\u0060\u0060\u0060\n`);
          JS
      - name: Remove this run's isolated probe Worker
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const { CLOUDFLARE_ACCOUNT_ID: account, CLOUDFLARE_API_TOKEN: token, PROBE_NAME: name, GITHUB_RUN_ID: runId } = process.env;
          if (!/^\d+$/.test(runId) || name !== `substack-reader-probe-older-${runId}`) throw new Error('Unexpected cleanup target');
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}`, {
            method: 'DELETE', headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(30000),
          });
          if (response.status !== 404 && !response.ok) throw new Error(`Probe cleanup HTTP ${response.status}`);
          if (response.ok && !(await response.json()).success) throw new Error('Cloudflare did not confirm probe cleanup.');
          console.log('::notice title=Probe cleanup::Isolated diagnostic Worker removed or already absent');
          JS

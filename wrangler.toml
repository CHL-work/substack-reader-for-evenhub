name = "substack-reader-relay"
main = "worker/relay.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# Cloudflare can read recent RSS but some older public pages are rate limited.
PUBLIC_ARCHIVE_FALLBACK = "0"

[observability]
enabled = false

[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Strict budget for costly work: custom-domain mapping proofs and /v1/health?probe=1.
[[ratelimits]]
name = "RL_STRICT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
